<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101c27"><link rel="manifest" href="/manifest.json"><title>PatronPoker</title><style>body{margin:0;background:#101c27;color:#fff;font:16px system-ui}main{max-width:950px;margin:auto;padding:20px}h1{color:#eac47d}button,input,select{padding:11px;border-radius:9px;border:1px solid #536270;font:inherit}button{background:#eac47d;color:#15212b;cursor:pointer;font-weight:700}input,select{background:#243442;color:white;max-width:100%}.panel{background:#1b2b37;border-radius:16px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}label{display:flex;flex-direction:column;gap:5px}label.check{flex-direction:row;align-items:center}.felt{background:radial-gradient(ellipse,#187752,#08452f);border:12px solid #68462b;border-radius:48%;min-height:320px;padding:25px;display:flex;flex-direction:column;align-items:center;justify-content:space-around;gap:18px}.players{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.player{background:#10251fbf;padding:12px;border-radius:12px;min-width:100px;text-align:center}.turn{outline:3px solid #eac47d}.cards{font-size:27px;letter-spacing:3px}.card{background:#fff;color:#222;border-radius:5px;padding:5px;display:inline-block;margin:2px}.red{color:#cf3030}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.muted{color:#acbbc6}#game{display:none}#setup{display:none}input[type=range]{width:100%;accent-color:#eac47d}</style></head><body><main><h1>♠ PatronPoker</h1><section id="auth" class="panel"><h2>Аккаунт</h2><div class="grid"><label>Email<input id="email" type="email" autocomplete="email"></label><label>Ник (для регистрации)<input id="nick" maxlength="30"></label><label>Пароль (от 10 символов)<input id="password" type="password" autocomplete="current-password"></label></div><p><button onclick="authenticate('register')">Регистрация</button> <button onclick="authenticate('login')">Войти</button></p><p id="authError" class="muted"></p></section><section id="setup" class="panel"><h2>Создать стол / присоединиться</h2><p>Вы вошли как <b id="currentUser"></b> <button onclick="signout()">Выйти</button></p><h3>Правила стола</h3><div class="grid" id="fields"></div><p><button onclick="create()">Создать стол</button></p><label>Код стола <input id="code" placeholder="ABC123"></label><p><button onclick="join()">Присоединиться</button></p></section><section id="game"><div class="panel"><h2>Стол <span id="room"></span></h2><button onclick="navigator.clipboard.writeText(location.href)">Скопировать ссылку</button> <button id="start" onclick="socket.emit('start')">Начать следующую раздачу</button><p id="status"></p></div><div class="felt"><div id="players" class="players"></div><div><div id="board" class="cards"></div><p id="pot"></p></div><div id="hole" class="cards"></div></div><div id="actions" class="actions"></div><div class="panel"><h3>События</h3><div id="log"></div></div></section></main><script src="/socket.io/socket.io.js"></script><script>
const defs=[['bb','Большой блайнд',50],['stack','Стартовый стек',5000],['seats','Мест',6],['seconds','Секунд на ход',30],['callTime','Колл-тайм',true],['callSeconds','Добавить секунд',15],['bomb','Bomb Pot',false],['bombEvery','Каждые N раздач',10],['bombBoards','Количество бордов',2],['bombMinBB','Минимум анте, BB',2],['bombMaxBB','Максимум анте, BB',4],['seven','Бонус 7-2 разномастные',true],['sevenBB','Бонус от каждого в BB',5],['straddle','Разрешить Straddle (добровольный)',false],['straddleBB','Размер Straddle в BB',2],['restraddle','Разрешить Re-straddle (при наличии Straddle)',false],['restraddleMultiplier','Множитель Re-straddle к Straddle',2]];
fields.innerHTML=defs.map(([k,t,v])=>typeof v==='boolean'?`<label class="check"><input type="checkbox" id="${k}" ${v?'checked':''}> ${t}</label>`:((k==='bb'||k==='stack')?`<label>${t}: <output id="out_${k}">${v}</output><input type="range" min="${k==='bb'?25:500}" max="${k==='bb'?500:50000}" step="${k==='bb'?25:500}" id="${k}" value="${v}" oninput="document.getElementById('out_${k}').textContent=this.value"></label>`:`<label>${t}<input type="number" min="1" id="${k}" value="${v}"></label>`)).join('');
let socket=null,state=null;const params=new URLSearchParams(location.search);if(params.get('room'))code.value=params.get('room');
async function authenticate(mode){const res=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,nick:nick.value,password:password.value})});const data=await res.json();if(!res.ok){authError.textContent=data.error;return}authError.textContent='';await init()}
async function signout(){await fetch('/api/auth/logout',{method:'POST'});location.reload()}
async function init(){const r=await fetch('/api/me');if(!r.ok){auth.style.display='block';setup.style.display='none';game.style.display='none';return}const {user}=await r.json();auth.style.display='none';setup.style.display='block';currentUser.textContent=user.nick;if(socket)socket.disconnect();socket=io();socket.on('connect_error',e=>authError.textContent=e.message);socket.on('state',render);if(code.value)socket.emit('join',{code:code.value},result)}
function create(){const config=Object.fromEntries(defs.map(([k,t,v])=>[k,typeof v==='boolean'?document.getElementById(k).checked:Number(document.getElementById(k).value)]));config.sb=config.bb/2;socket.emit('create',{config},result)}
function join(){socket.emit('join',{code:code.value},result)}
function result(r){if(r.error)return alert(r.error);history.replaceState(null,'','?room='+r.code)}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function card(c){return `<span class="card ${'hd'.includes(c[1])?'red':''}">${c[0]}${{h:'♥',d:'♦',c:'♣',s:'♠'}[c[1]]}</span>`}function action(type){socket.emit('action',{type,amount:Number(document.getElementById('raise')?.value||0)})}function render(s){state=s;setup.style.display='none';game.style.display='block';room.textContent=s.code;start.style.display=s.you===s.host?'inline-block':'none';const h=s.hand;players.innerHTML=s.players.map(p=>`<div class="player ${h?.turn===p.id?'turn':''}"><b>${esc(p.name)}</b>${p.id===s.you?' (вы)':''}<br>🪙 ${p.stack}<br>${p.bet?'Ставка: '+p.bet:''}${p.fold&&p.active?' · пас':''}${!p.connected?' · offline':''}</div>`).join('');board.innerHTML=(h?.boards?.length?h.boards:[h?.board||[]]).map((cards,i)=>'<div>'+ (h.boards?.length?'Борд '+(i+1)+': ':'')+cards.map(card).join('')+'</div>').join('');hole.innerHTML=h?.cards.map(card).join('')||'';pot.textContent=h?'Банк: '+h.pot:'';status.textContent=h?`Улица: ${h.street} · ${h.turn?'Ход: '+s.players.find(p=>p.id===h.turn)?.name:'Раздача завершена'}`:'Ожидание игроков';log.innerHTML=h?.log.map(x=>`<p>${esc(x)}</p>`).join('')||'';const my=s.players.find(p=>p.id===s.you);actions.innerHTML=h?.turn===s.you&&h.straddleOffer?`<strong>${h.straddleOffer.kind==='first'?'Straddle':'Re-straddle'}: ${h.straddleOffer.amount} фишек</strong><button onclick="action('straddle')">Поставить</button><button onclick="action('skip')">Пропустить</button>${s.config.callTime&&!h.callUsed?'<button onclick="action(\'time\')">Колл-тайм</button>':''}<span id="clock"></span>`:h?.turn===s.you?`<button onclick="action('fold')">Пас</button><button onclick="action('check')">Чек</button><button onclick="action('call')">Колл</button><input id="raise" type="number" placeholder="Рейз до" min="1" value="${Math.min(my.stack+my.bet,Math.max(s.config.bb,h.current*2))}"><button onclick="action('raise')">Рейз</button><button onclick="action('allin')">Олл-ин</button>${s.config.callTime&&!h.callUsed?'<button onclick="action(\'time\')">Колл-тайм +'+s.config.callSeconds+'с</button>':''}<span id="clock"></span>`:'';if(h?.showdown)log.innerHTML+='<p>Вскрытие: '+h.showdown.map(x=>s.players.find(p=>p.id===x.id)?.name+': '+x.cards.join(' ')).join(' / ')+'</p>'}setInterval(()=>{if(state?.hand?.turn===state.you&&document.getElementById('clock'))clock.textContent='⏳ '+Math.max(0,Math.ceil((state.hand.deadline-Date.now())/1000))+' с'},250);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');init();
</script></body></html>
